name: One-time Guangya name cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-guangya-names.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean legacy display names and log prefixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('plugins.v2/shukguangyadisk')
          text_suffixes = {'.py', '.js', '.vue', '.md', '.json', '.yml', '.yaml', '.css', '.html'}

          # Source-level cleanup: user-visible old prefixes/names are replaced directly.
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              old = text
              text = text.replace('【Shuk-光鸭云盘】', '【光鸭云盘助手】')
              text = text.replace('【光鸭云盘】', '【光鸭云盘助手】')
              text = text.replace('【WebDAV】', '【光鸭云盘助手】【WebDAV】')
              text = text.replace('Shuk-光鸭云盘客户端创建失败', '光鸭云盘助手客户端创建失败')
              # Legacy implementation metadata should also match the current plugin display name.
              if path.name == '_plugin_legacy.py':
                  text = text.replace('plugin_name = "Shuk-光鸭云盘"', 'plugin_name = "光鸭云盘助手"')
                  text = text.replace('_disk_name = "Shuk-光鸭云盘"', '_disk_name = "光鸭云盘助手"')
                  text = text.replace('plugin_version = "2.2.3"', 'plugin_version = "2.2.16"')
                  text = text.replace('plugin_author = "ShukeBta"', 'plugin_author = "liheng-lk"')
                  text = text.replace('author_url = "https://github.com/ShukeBta/Guangyadisk"', 'author_url = "https://github.com/liheng-lk/Guangyadisk"')
              if text != old:
                  path.write_text(text, encoding='utf-8')

          # The adapter was only a transitional workaround. Remove it now that legacy files are clean.
          init_path = root / '__init__.py'
          text = init_path.read_text(encoding='utf-8')
          text = text.replace('from app.log import logger as _base_logger', 'from app.log import logger')
          for line in [
              'from . import _plugin_legacy as _plugin_legacy_module\n',
              'from . import guangya_api as _guangya_api_module\n',
              'from . import guangya_api_legacy as _guangya_api_legacy_module\n',
              'from . import guangya_client as _guangya_client_module\n',
              'from . import guangya_client_legacy as _guangya_client_legacy_module\n',
              'from . import webdav_provider as _webdav_provider_module\n',
          ]:
              text = text.replace(line, '')
          text = re.sub(
              r'\nclass _UnifiedLogPrefixAdapter:.*?\n\nclass ShukGuangYaDisk\(_LegacyPlugin\):',
              '\n\nclass ShukGuangYaDisk(_LegacyPlugin):',
              text,
              flags=re.S,
          )
          # Keep exactly one old display-name literal only for migration of existing MoviePilot storage configs.
          text = re.sub(r'_legacy_disk_name\s*=\s*"[^"]+"', '_legacy_disk_name = "Shuk-光鸭云盘"', text)
          init_path.write_text(text, encoding='utf-8')

          # Verify forbidden user-visible prefixes are gone from runtime source.
          forbidden = ['【Shuk-光鸭云盘】', '【光鸭云盘】', '【WebDAV】']
          failures = []
          for path in root.rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              for marker in forbidden:
                  if marker in text:
                      failures.append(f'{path}: {marker}')
          if failures:
              raise SystemExit('Unclean log prefixes remain:\n' + '\n'.join(failures))

          # Remove this one-shot workflow from the resulting repository state.
          Path('.github/workflows/cleanup-guangya-names.yml').unlink(missing_ok=True)
          PY

      - name: Commit cleaned source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'chore: fully unify Guangya Cloud Assistant names'
          git push
